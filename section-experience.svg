<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="68" viewBox="0 0 1000 68" role="img" aria-label="Experience section">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="52%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#102A36"/>
    </linearGradient>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #B8C5D9; }
      .bright { fill: #F8FAFC; }
      .chip { fill: #172B45; stroke: #49658A; stroke-width: 1; }
      .pulse { animation: pulse 3.5s ease-in-out infinite; }
      .drift { animation: drift 6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .drift { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="66" rx="13" fill="url(#card)" stroke="#334B70"/>
  <rect x="1" y="1" width="7" height="66" rx="3" fill="url(#grad)"/>
  <text x="28" y="43" class="txt bright" font-size="23" font-weight="700">Experience</text>
  <path d="M850 34 H960" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" class="pulse"/>

</svg>