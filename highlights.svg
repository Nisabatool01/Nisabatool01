<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-label="Profile highlights: one internship, four projects, one degree, thirteen skills and tools">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="52%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#102A36"/>
    </linearGradient>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #B8C5D9; }
      .bright { fill: #F8FAFC; }
      .chip { fill: #172B45; stroke: #49658A; stroke-width: 1; }
      .pulse { animation: pulse 3.5s ease-in-out infinite; }
      .drift { animation: drift 6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .drift { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="158" rx="20" fill="url(#card)" stroke="#334B70"/>
  <g class="txt" text-anchor="middle">
    <g transform="translate(20,18)"><rect width="230" height="120" rx="14" fill="#142B49" stroke="#3B82F6"/><text x="115" y="54" class="bright" font-size="31" font-weight="700">1</text><text x="115" y="82" class="muted" font-size="14">Internship</text></g>
    <g transform="translate(265,18)"><rect width="230" height="120" rx="14" fill="#142B49" stroke="#8B5CF6"/><text x="115" y="54" class="bright" font-size="31" font-weight="700">4</text><text x="115" y="82" class="muted" font-size="14">Projects listed</text></g>
    <g transform="translate(510,18)"><rect width="230" height="120" rx="14" fill="#142B49" stroke="#14B8A6"/><text x="115" y="54" class="bright" font-size="31" font-weight="700">1</text><text x="115" y="82" class="muted" font-size="14">Degree</text></g>
    <g transform="translate(755,18)"><rect width="223" height="120" rx="14" fill="#142B49" stroke="#6366F1"/><text x="111" y="54" class="bright" font-size="31" font-weight="700">13</text><text x="111" y="82" class="muted" font-size="14">Skills &amp; tools</text></g>
  </g>

</svg>