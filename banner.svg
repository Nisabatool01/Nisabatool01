<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Syeda Nisa Batool — Backend Developer Intern">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="52%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#102A36"/>
    </linearGradient>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #B8C5D9; }
      .bright { fill: #F8FAFC; }
      .chip { fill: #172B45; stroke: #49658A; stroke-width: 1; }
      .pulse { animation: pulse 3.5s ease-in-out infinite; }
      .drift { animation: drift 6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .drift { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="218" rx="22" fill="url(#card)" stroke="#334B70"/>
  <circle cx="870" cy="42" r="115" fill="#4338CA" opacity=".14"/>
  <circle cx="930" cy="180" r="105" fill="#0D9488" opacity=".14"/>
  <path d="M0 190 C220 150 360 240 560 190 S850 130 1000 175" fill="none" stroke="url(#grad)" stroke-width="2" opacity=".8" class="pulse"/>
  <text x="48" y="78" class="txt bright" font-size="34" font-weight="700">Syeda Nisa Batool</text>
  <text x="50" y="111" class="txt muted" font-size="17">Backend Developer Intern  |  Software Engineering Graduate</text>
  <text x="50" y="145" class="txt muted" font-size="13">Building with Python, Django, PHP and relational databases</text>
  <g class="drift">
    <rect x="50" y="166" width="86" height="29" rx="14" class="chip"/><text x="93" y="185" text-anchor="middle" class="txt bright" font-size="12">Python</text>
    <rect x="146" y="166" width="86" height="29" rx="14" class="chip"/><text x="189" y="185" text-anchor="middle" class="txt bright" font-size="12">Django</text>
    <rect x="242" y="166" width="74" height="29" rx="14" class="chip"/><text x="279" y="185" text-anchor="middle" class="txt bright" font-size="12">PHP</text>
    <rect x="326" y="166" width="84" height="29" rx="14" class="chip"/><text x="368" y="185" text-anchor="middle" class="txt bright" font-size="12">MySQL</text>
    <rect x="420" y="166" width="82" height="29" rx="14" class="chip"/><text x="461" y="185" text-anchor="middle" class="txt bright" font-size="12">PostgreSQL</text>
    <rect x="512" y="166" width="75" height="29" rx="14" class="chip"/><text x="549" y="185" text-anchor="middle" class="txt bright" font-size="12">HTML</text>
    <rect x="597" y="166" width="72" height="29" rx="14" class="chip"/><text x="633" y="185" text-anchor="middle" class="txt bright" font-size="12">CSS</text>
  </g>

</svg>