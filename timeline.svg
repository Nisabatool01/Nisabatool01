<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="176" viewBox="0 0 1000 176" role="img" aria-label="Career timeline: BS Software Engineering 2021 to 2025; Backend Developer Intern at Tecveq from September 2026">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="52%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#102A36"/>
    </linearGradient>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #B8C5D9; }
      .bright { fill: #F8FAFC; }
      .chip { fill: #172B45; stroke: #49658A; stroke-width: 1; }
      .pulse { animation: pulse 3.5s ease-in-out infinite; }
      .drift { animation: drift 6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .drift { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="174" rx="20" fill="url(#card)" stroke="#334B70"/>
  <line x1="130" y1="82" x2="870" y2="82" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="82" r="10" fill="#3B82F6" stroke="#DBEAFE" stroke-width="3" class="pulse"/>
  <circle cx="740" cy="82" r="10" fill="#14B8A6" stroke="#CCFBF1" stroke-width="3" class="pulse"/>
  <g class="txt">
    <text x="260" y="42" text-anchor="middle" class="bright" font-size="17" font-weight="700">BS Software Engineering</text>
    <text x="260" y="128" text-anchor="middle" class="muted" font-size="14">2021 – 2025</text>
    <text x="740" y="42" text-anchor="middle" class="bright" font-size="17" font-weight="700">Backend Developer Intern · Tecveq</text>
    <text x="740" y="128" text-anchor="middle" class="muted" font-size="14">September 2026 – Present</text>
  </g>

</svg>